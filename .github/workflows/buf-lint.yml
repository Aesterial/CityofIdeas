name: Buf Lint

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/buf-lint.yml"
  push:
    branches: ["main"]
    paths:
      - "api/**"
      - ".github/workflows/buf-lint.yml"
  workflow_dispatch:

jobs:
  buf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint
        run: buf lint
