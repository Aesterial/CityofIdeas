name: Web Link + Typecheck

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/web-link-typecheck.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/web-link-typecheck.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Link check
        run: npm run build
