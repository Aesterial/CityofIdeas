version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "./migrations/scheme/scheme.sql"
    queries:
      - "./migrations/queries/queries.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/infra/database/sqlc"
        sql_package: "pgx/v5"
        emit_exported_queries: true
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_all_enum_values: true
        emit_interface: true
