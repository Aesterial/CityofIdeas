edition = "2023";

package xyz.city_ideas.v1;

option go_package = "github.com/aesterial/cityideas/backend/internal/api/v1;v1";

message RequestWithValue {
  string value = 1;
}

message RequestWithLimitAndOffset {
  int32 limit = 1;
  int32 offset = 2;
}

enum Device {
  DEVICE_UNSPECIFIED = 0;
  DEVICE_DESKTOP = 1;
  DEVICE_MOBILE = 2;
  DEVICE_TABLET = 3;
}
