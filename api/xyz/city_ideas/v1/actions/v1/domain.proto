edition = "2023";

package xyz.city_ideas.v1.actions.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aesterial/cityideas/backend/internal/api/v1/actions/v1;v1";

message Action {
  string id = 1;
  string owner = 2;
  string purpose = 3;
  string hash = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp used = 7;
}

message CreateActionRequest {
  string purpose = 1;
  string user = 2;
}

message CreateActionResponse {
  Action action = 1;
}

message UseActionRequest {
  string purpose = 1;
  string hash = 2;
}

message FindActionRequest {
  string purpose = 1;
  string hash = 2;
}

message FindActionResponse {
  Action action = 1;
}

message GetActionsByOwnerRequest {
  string user = 1;
}

message GetActionsByOwnerResponse {
  repeated Action actions = 1;
}

message CheckActionRequest {
  string purpose = 1;
  string hash = 2;
}
