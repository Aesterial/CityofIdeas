edition = "2023";

package xyz.city_ideas.v1.user.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aesterial/cityideas/backend/internal/api/v1/user/v1;v1";

enum Languages {
  LANGUAGES_UNSPECIFIED = 0;
  LANGUAGES_RUSSIAN = 1;
  LANGUAGES_ENGLISH = 2;
}

message UserPreferences {
  string description = 1;
  string display_name = 2;
  string avatar = 3;
  Languages lang = 4;
}

message UserRank {
  string name = 1;
  int64 color = 2;
}

message PublicUser {
  string id = 1;
  string username = 2;
  google.protobuf.Timestamp joined = 3;
  UserPreferences prefs = 4;
  UserRank rank = 5;
}

message Security {
  string email = 1;
  bool email_verified = 2;
  bool totp_enabled = 3;
}

message PrivateUser {
  PublicUser public = 1;
  int32 session_live = 2;
  Security security = 3;
  repeated string permissions = 4;
}

message UpdatePreferencesRequest {
  string display_name = 1;
  string description = 2;
  string avatar_hash = 3;
  int32 session_live_time = 4;
}

message ListResponse {
  repeated PublicUser list = 1;
}
