edition = "2023";

package xyz.city_ideas.v1.user.v1;

import "google/protobuf/empty.proto";
import "xyz/city_ideas/v1/types.proto";
import "xyz/city_ideas/v1/user/v1/domain.proto";

option go_package = "github.com/aesterial/cityideas/backend/internal/api/v1/user/v1;v1";

service UserService {
  rpc Info(xyz.city_ideas.v1.RequestWithValue) returns (xyz.city_ideas.v1.user.v1.PublicUser);
  rpc Self(google.protobuf.Empty) returns (xyz.city_ideas.v1.user.v1.PrivateUser);
  rpc List(xyz.city_ideas.v1.RequestWithLimitAndOffset) returns (xyz.city_ideas.v1.user.v1.ListResponse);
  rpc UpdatePreferences(xyz.city_ideas.v1.user.v1.UpdatePreferencesRequest) returns (xyz.city_ideas.v1.user.v1.UserPreferences);
  rpc Ban(xyz.city_ideas.v1.user.v1.BanRequest) returns (google.protobuf.Empty);
  rpc Unban(xyz.city_ideas.v1.RequestWithValue) returns (google.protobuf.Empty);
}
