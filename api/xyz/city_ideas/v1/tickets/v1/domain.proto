edition = "2023";

package xyz.city_ideas.v1.tickets.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/aesterial/cityideas/backend/internal/api/v1/tickets/v1;v1";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_CLOSED = 1;
  STATUS_WAITING = 2;
  STATUS_LISTING = 3;
  STATUS_IMPLEMENTING = 4;
}

enum Caller {
  CALLER_UNSPECIFIED = 0;
  CALLER_USER = 1;
  CALLER_STAFF = 2;
  CALLER_SYSTEM = 3;
}

message Ticket {
  string id = 1;
  string author_id = 2;
  string acceptor = 3;
  Status status = 4;
  string topic = 5;
  string title = 6;
  google.protobuf.Timestamp created = 7;
  google.protobuf.Timestamp accepted = 8;
  google.protobuf.Timestamp closed = 9;
  Caller caller = 10;
  string closer = 11;
  string reason = 12;
}

message Message {
  string id = 1;
  string ticket = 2;
  string author = 3;
  string content = 4;
  google.protobuf.Timestamp created = 5;
}

message CreateTicketRequest {
  string topic = 1;
  string title = 2;
  string message = 3;
}

message TicketListResponse {
  repeated Ticket list = 1;
}

message MessageListResponse {
  repeated Message list = 1;
}