version: v2

inputs:
  - directory: .

plugins:
  - local: protoc-gen-go
    out: ../backend
    opt:
      - module=github.com/aesterial/cityideas/backend
      - default_api_level=API_OPAQUE
  - local: protoc-gen-go-grpc
    out: ../backend
    opt:
      - module=github.com/aesterial/cityideas/backend
      - require_unimplemented_servers=false
  - local:
      - node
      - ../frontend/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: ../frontend/gen
    opt:
      - target=ts
